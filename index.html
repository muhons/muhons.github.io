<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muhons Apps — Simple &amp; Useful Utility Apps</title>
  <meta name="description" content="Muhons official website. Simple, fast, and reliable Android utility apps.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="brand">
        <span class="brand-logo">M</span>
        <span class="brand-name">Muhons</span>
      </a>
      <div class="lang-switch" role="group" aria-label="Language selector">
        <button type="button" class="lang-btn" data-lang="ko">KO</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1 data-i18n="hero_title">일상을 편하게 만드는 실용적인 앱</h1>
        <p class="hero-sub" data-i18n="hero_desc">
          복잡함은 덜어내고 꼭 필요한 기능만 담은 안드로이드 유틸리티 앱을 만듭니다.
        </p>
      </div>
    </section>

    <section class="apps-section">
      <div class="container">
        <h2 class="section-title" data-i18n="apps_title">앱 목록</h2>
        <div id="app-grid" class="app-grid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> Muhons. <span data-i18n="footer_rights">All rights reserved.</span></p>
      <p>
        <span data-i18n="footer_contact">문의:</span>
        <a href="mailto:muhons@gmail.com">muhons@gmail.com</a>
      </p>
    </div>
  </footer>

  <div id="app-modal" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <button type="button" id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      <div class="modal-header">
        <div id="modal-icon" class="app-icon modal-icon" aria-hidden="true"></div>
        <div>
          <h3 id="modal-title" class="modal-title"></h3>
          <span id="modal-category" class="app-category"></span>
        </div>
      </div>
      <p id="modal-desc" class="modal-desc"></p>
      <ul id="modal-features" class="modal-features"></ul>
      <div class="modal-actions">
        <a id="modal-store" class="btn-store" href="#" target="_blank" rel="noopener noreferrer">
          <span>▶</span>
          <span data-i18n="store_btn">Google Play</span>
        </a>
        <a id="modal-privacy" class="link-privacy" href="#" data-i18n="privacy_link">개인정보처리방침</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
